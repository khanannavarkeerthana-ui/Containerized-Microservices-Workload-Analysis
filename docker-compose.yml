services:

  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    ports:
      - "8001:8001"
    networks:
      - food-network

  food-service:
    build:
      context: ./services/food-service
    container_name: food-service
    ports:
      - "8002:8002"
    networks:
      - food-network

  order-service:
    build:
      context: ./services/order-service
    container_name: order-service
    ports:
      - "8000:8000"
    networks:
      - food-network

networks:
  food-network:
    driver: bridge